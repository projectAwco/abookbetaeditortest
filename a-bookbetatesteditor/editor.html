<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020012">
  <title>A-Book — Editor</title>

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/elements.css">
  <link rel="stylesheet" href="assets/css/blocks.css">
  <link rel="stylesheet" href="assets/css/editor.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="ab-editor-page">

  <div class="ab-editor" id="ab-editor">

    <!-- ============================= HEADER ============================= -->
    <header class="ab-editor-header glass" role="banner">

            <div class="ab-editor-header__left">
        <button type="button"
                class="ab-icon-btn ab-editor-header__menu-left"
                id="btn-menu-left"
                aria-label="Buka panel insert"
                data-tooltip="Panel insert">
          <i data-lucide="menu"></i>
        </button>

        <a href="dashboard.html"
           class="ab-editor-header__logo"
           aria-label="Kembali ke dashboard">
          <i data-lucide="book-open"></i>
        </a>

        <input type="text"
               class="ab-editor-header__name"
               id="project-name"
               value="Project"
               aria-label="Nama project"
               spellcheck="false"
               autocomplete="off"
               maxlength="80">

        <span class="ab-save-status"
              id="save-status"
              data-state="saved"
              aria-live="polite"
              aria-atomic="true">
          <span class="ab-icon" id="save-icon"></span>
          <span class="ab-save-status__text" id="save-text">Tersimpan</span>
        </span>
      </div>

      <div class="ab-editor-header__right">

        <button type="button" class="ab-icon-btn" id="btn-undo"
                aria-label="Undo" data-tooltip="Undo (Ctrl+Z)" disabled>
          <i data-lucide="undo-2"></i>
        </button>

        <button type="button" class="ab-icon-btn" id="btn-redo"
                aria-label="Redo" data-tooltip="Redo (Ctrl+Shift+Z)" disabled>
          <i data-lucide="redo-2"></i>
        </button>

        <span class="ab-editor-header__divider" aria-hidden="true"></span>

        <div class="ab-zoom-wrap">
          <button type="button"
                  class="ab-header-btn"
                  id="btn-zoom"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  data-tooltip="Zoom">
            <i data-lucide="search"></i>
            <span id="zoom-display">100%</span>
            <i data-lucide="chevron-down" class="ab-header-btn__chev"></i>
          </button>

          <div class="ab-zoom-menu" id="zoom-menu" role="menu" hidden>
            <button type="button" class="ab-zoom-menu__item" data-zoom="0.5"  role="menuitem">50%</button>
            <button type="button" class="ab-zoom-menu__item" data-zoom="0.75" role="menuitem">75%</button>
            <button type="button" class="ab-zoom-menu__item" data-zoom="1"    role="menuitem">100%</button>
            <button type="button" class="ab-zoom-menu__item" data-zoom="1.25" role="menuitem">125%</button>
            <button type="button" class="ab-zoom-menu__item" data-zoom="1.5"  role="menuitem">150%</button>
            <button type="button" class="ab-zoom-menu__item" data-zoom="1.75" role="menuitem">175%</button>
            <button type="button" class="ab-zoom-menu__item" data-zoom="2"    role="menuitem">200%</button>
          </div>
        </div>

        <button type="button"
                class="ab-header-btn"
                id="btn-preview"
                data-tooltip="Pratinjau (Esc untuk keluar)">
          <i data-lucide="play"></i>
          <span>Pratinjau</span>
        </button>

        <button type="button"
                class="ab-header-btn ab-header-btn--accent iridescent-border"
                id="btn-export"
                data-tooltip="Ekspor sebagai ZIP">
          <i data-lucide="download"></i>
          <span>Ekspor</span>
        </button>

        <button type="button"
                class="ab-icon-btn ab-editor-header__menu-right"
                id="btn-menu-right"
                aria-label="Buka panel properti"
                data-tooltip="Panel properti">
          <i data-lucide="sliders-horizontal"></i>
        </button>
      </div>
    </header>

    <!-- ============================= BODY ============================= -->
    <div class="ab-editor-body">

      <!-- ---------- Left sidebar ---------- -->
      <aside class="ab-panel ab-panel--left glass"
             id="panel-left"
             aria-label="Panel insert">

        <div class="ab-sidebar-tabs" role="tablist" aria-label="Panel insert">

          <button type="button" role="tab"
                  class="ab-sidebar-tab is-active"
                  data-tab="template"
                  id="tab-template"
                  aria-selected="true"
                  aria-controls="panel-template">
            <i data-lucide="layout-template"></i>
            <span>Template</span>
          </button>

          <button type="button" role="tab"
                  class="ab-sidebar-tab"
                  data-tab="element"
                  id="tab-element"
                  aria-selected="false"
                  aria-controls="panel-element">
            <i data-lucide="box"></i>
            <span>Element</span>
          </button>

          <button type="button" role="tab"
                  class="ab-sidebar-tab"
                  data-tab="blocks"
                  id="tab-blocks"
                  aria-selected="false"
                  aria-controls="panel-blocks">
            <i data-lucide="blocks"></i>
            <span>Blok</span>
          </button>

          <button type="button" role="tab"
                  class="ab-sidebar-tab"
                  data-tab="pages"
                  id="tab-pages"
                  aria-selected="false"
                  aria-controls="panel-pages">
            <i data-lucide="file-text"></i>
            <span>Halaman</span>
          </button>
        </div>

        <div class="ab-sidebar-panels">

          <div class="ab-tabpanel is-active"
               id="panel-template"
               role="tabpanel"
               data-panel="template"
               aria-labelledby="tab-template">
            <div class="ab-empty-list">
              <p class="ab-empty-list__text">Belum ada item</p>
            </div>
          </div>

          <div class="ab-tabpanel"
               id="panel-element"
               role="tabpanel"
               data-panel="element"
               aria-labelledby="tab-element"
               hidden>
            <div class="ab-empty-list">
              <p class="ab-empty-list__text">Belum ada item</p>
            </div>
          </div>

          <div class="ab-tabpanel"
               id="panel-blocks"
               role="tabpanel"
               data-panel="blocks"
               aria-labelledby="tab-blocks"
               hidden>
            <div class="ab-empty-list">
              <p class="ab-empty-list__text">Belum ada item</p>
            </div>
          </div>

          <div class="ab-tabpanel"
               id="panel-pages"
               role="tabpanel"
               data-panel="pages"
               aria-labelledby="tab-pages"
               hidden>
            <div class="ab-empty-list">
              <p class="ab-empty-list__text">Belum ada item</p>
            </div>
          </div>

        </div>
      </aside>

      <!-- ---------- Center canvas ---------- -->
      <main class="ab-canvas-wrap">

        <div class="ab-page-tabs" role="tablist" aria-label="Halaman project">
          <div class="ab-page-tabs__list" id="page-tabs-list"></div>
          <button type="button"
                  class="ab-icon-btn ab-page-tabs__add"
                  id="btn-add-page"
                  aria-label="Tambah halaman"
                  data-tooltip="Halaman baru">
            <i data-lucide="plus"></i>
          </button>
        </div>

        <div class="ab-canvas" id="canvas" tabindex="0" aria-label="Kanvas">

          <div class="ab-canvas__inner" id="canvas-inner">
            <iframe id="ab-preview"
                    class="ab-preview"
                    sandbox="allow-scripts"
                    title="Pratinjau halaman"
                    referrerpolicy="no-referrer"></iframe>
          </div>

          <div class="ab-selection-overlay is-empty" id="selection-overlay"></div>
          <div class="ab-canvas-toolbar" role="toolbar" aria-label="Kontrol kanvas">

            <button type="button" class="ab-icon-btn" id="btn-zoom-out"
                    aria-label="Perkecil" data-tooltip="Perkecil">
              <i data-lucide="zoom-out"></i>
            </button>

            <button type="button"
                    class="ab-canvas-toolbar__zoom"
                    id="toolbar-zoom-label"
                    aria-label="Reset zoom ke 100%">100%</button>

            <button type="button" class="ab-icon-btn" id="btn-zoom-in"
                    aria-label="Perbesar" data-tooltip="Perbesar">
              <i data-lucide="zoom-in"></i>
            </button>

            <span class="ab-canvas-toolbar__divider" aria-hidden="true"></span>

            <button type="button" class="ab-icon-btn" id="btn-fit"
                    aria-label="Sesuaikan layar" data-tooltip="Fit ke layar">
              <i data-lucide="maximize-2"></i>
            </button>

            <button type="button" class="ab-icon-btn" id="btn-code"
                    aria-label="Lihat kode HTML" data-tooltip="Kode HTML">
              <i data-lucide="code"></i>
            </button>
          </div>
        </div>
      </main>

      <!-- ---------- Right properties panel ---------- -->
      <aside class="ab-panel ab-panel--right glass"
             id="panel-right"
             aria-label="Panel properti">

        <div class="ab-panel-right__body">

          <div class="ab-right-empty" id="right-empty">
            <span class="ab-right-empty__icon">
              <i data-lucide="mouse-pointer-2"></i>
            </span>
            <p class="ab-right-empty__text">Pilih elemen untuk melihat properti</p>
          </div>

          <div class="ab-right-props" id="right-props" hidden></div>
        </div>
      </aside>

    </div>
  </div>

  <!-- Drawer backdrop (tablet / mobile) -->
  <div class="ab-drawer-backdrop" id="drawer-backdrop" hidden></div>

  <!-- Code dialog -->
  <div class="ab-dialog" id="code-dialog" hidden>
    <div class="ab-dialog__backdrop" data-dialog-close></div>

    <div class="ab-dialog__panel"
         role="dialog"
         aria-modal="true"
         aria-labelledby="code-dialog-title">

      <header class="ab-dialog__head">
        <h2 class="ab-dialog__title" id="code-dialog-title">Kode HTML</h2>

        <div class="ab-dialog__actions">
          <button type="button"
                  class="ab-btn ab-btn--sm ab-btn--ghost"
                  id="btn-copy-code">
            <i data-lucide="copy"></i>
            Salin
          </button>

          <button type="button"
                  class="ab-icon-btn"
                  data-dialog-close
                  aria-label="Tutup">
            <i data-lucide="x"></i>
          </button>
        </div>
      </header>

      <pre class="ab-dialog__code"><code id="code-output"></code></pre>
    </div>
  </div>

  <!-- Toast -->
  <div class="ab-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="assets/icons/lucide-inline.js"></script>
  <script src="assets/icons/lucide-inline-ext.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/templates.js"></script>
  <script src="assets/js/elements.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/dnd.js"></script>
  <script src="assets/js/resize.js"></script>
  <script src="assets/js/blocks.js"></script>
  <script src="assets/js/runtime.js"></script>
  <script src="assets/js/exporter.js"></script>
  <script src="assets/js/editor.js"></script>

    <!-- Fullscreen preview -->
  <div class="ab-preview-modal" id="preview-modal" hidden>
    <div class="ab-preview-modal__backdrop" data-preview-close></div>
    <div class="ab-preview-modal__panel" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
      <header class="ab-preview-modal__head">
        <h2 class="ab-preview-modal__title" id="preview-modal-title">Pratinjau</h2>
        <div class="ab-preview-modal__devices" role="group" aria-label="Ukuran perangkat">
          <button type="button" class="ab-preview-modal__device is-active" data-device="desktop" aria-label="Desktop"><i data-lucide="monitor"></i></button>
          <button type="button" class="ab-preview-modal__device" data-device="tablet" aria-label="Tablet"><i data-lucide="tablet"></i></button>
          <button type="button" class="ab-preview-modal__device" data-device="mobile" aria-label="Mobile"><i data-lucide="smartphone"></i></button>
        </div>
        <button type="button" class="ab-icon-btn" data-preview-close aria-label="Tutup pratinjau"><i data-lucide="x"></i></button>
      </header>
      <div class="ab-preview-modal__stage">
        <div class="ab-preview-modal__frame" id="preview-frame">
          <iframe id="ab-preview-full" sandbox="allow-scripts" title="Pratinjau penuh"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Export dialog -->
  <div class="ab-dialog ab-export-dialog" id="export-dialog" hidden>
    <div class="ab-dialog__backdrop" data-dialog-close></div>
    <div class="ab-dialog__panel ab-export-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="export-dialog-title">
      <header class="ab-dialog__head">
        <h2 class="ab-dialog__title" id="export-dialog-title">Ekspor Project</h2>
        <button type="button" class="ab-icon-btn" data-dialog-close aria-label="Tutup"><i data-lucide="x"></i></button>
      </header>
      <div class="ab-export-dialog__body">
        <label class="ab-prop-field">
          <span class="ab-prop-field__label">Nama file</span>
          <input type="text" class="ab-prop-input" id="export-filename" value="">
        </label>
        <label class="ab-prop-field">
          <span class="ab-prop-field__label">Kompresi</span>
          <select class="ab-prop-input" id="export-compression">
            <option value="DEFLATE">DEFLATE (kecil, standar)</option>
            <option value="STORE">STORE (cepat, tanpa kompresi)</option>
          </select>
        </label>
        <label class="ab-export-dialog__check">
          <input type="checkbox" id="export-source">
          <span>Sertakan file sumber (project.json)</span>
        </label>
        <div class="ab-export-dialog__progress" id="export-progress" hidden>
          <div class="ab-export-dialog__progress-track">
            <div class="ab-export-dialog__progress-bar" id="export-progress-bar"></div>
          </div>
          <span class="ab-export-dialog__progress-text" id="export-progress-text">0%</span>
        </div>
      </div>
      <footer class="ab-export-dialog__actions">
        <button type="button" class="ab-btn ab-btn--sm ab-btn--ghost" id="export-abook">
          <i data-lucide="file-archive"></i> Unduh .abook
        </button>
        <div class="ab-export-dialog__spacer"></div>
        <button type="button" class="ab-btn ab-btn--sm ab-btn--ghost" data-dialog-close>Batal</button>
        <button type="button" class="ab-btn ab-btn--sm iridescent-border" id="export-zip">
          <i data-lucide="download"></i> Unduh ZIP
        </button>
      </footer>
    </div>
  </div>

</body>
</html>
